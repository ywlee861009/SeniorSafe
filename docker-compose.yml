services:
  postgres:
    image: postgres:16-alpine
    container_name: seniorsafe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seniorsafe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seniorsafe}
      POSTGRES_DB: ${POSTGRES_DB:-seniorsafe_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: seniorsafe-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seniorsafe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seniorsafe}
      POSTGRES_DB: ${POSTGRES_DB:-seniorsafe_db}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      SECRET_KEY: ${SECRET_KEY:-change-this-to-a-long-random-secret}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      FIREBASE_CREDENTIALS_PATH: /app/firebase-credentials.json
      PAIRING_CODE_EXPIRE_MINUTES: ${PAIRING_CODE_EXPIRE_MINUTES:-10}
      FALL_CANCEL_WINDOW_SECONDS: ${FALL_CANCEL_WINDOW_SECONDS:-30}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "8000:8000"

  nginx:
    image: nginx:1.27-alpine
    container_name: seniorsafe-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
