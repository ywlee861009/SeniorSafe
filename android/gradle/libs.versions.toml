[versions]
agp                  = "8.5.2"
kotlin               = "2.0.21"
ksp                  = "2.0.21-1.0.28"
composeBom           = "2024.12.01"
navigationCompose    = "2.8.5"
hilt                 = "2.53.1"
hiltNavigationCompose = "1.2.0"
coroutines           = "1.9.0"
lifecycle            = "2.8.7"
retrofit             = "2.11.0"
okhttp               = "4.12.0"
datastore            = "1.1.1"
gson                 = "2.11.0"
firebaseBom          = "33.7.0"
coreKtx              = "1.13.1"
activityCompose      = "1.9.3"
room                 = "2.6.1"

[libraries]
# AndroidX Core
androidx-core-ktx           = { group = "androidx.core",     name = "core-ktx",            version.ref = "coreKtx" }
androidx-activity-compose   = { group = "androidx.activity", name = "activity-compose",     version.ref = "activityCompose" }

# Compose BOM
compose-bom                 = { group = "androidx.compose",  name = "compose-bom",          version.ref = "composeBom" }
compose-ui                  = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling-preview  = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling          = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-material3           = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons      = { group = "androidx.compose.material", name = "material-icons-extended" }

# Navigation
navigation-compose          = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Lifecycle / ViewModel
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose   = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose",   version.ref = "lifecycle" }

# Hilt
hilt-android                = { group = "com.google.dagger", name = "hilt-android",                version.ref = "hilt" }
hilt-compiler               = { group = "com.google.dagger", name = "hilt-android-compiler",       version.ref = "hilt" }
hilt-navigation-compose     = { group = "androidx.hilt",     name = "hilt-navigation-compose",     version.ref = "hiltNavigationCompose" }

# Network
retrofit                    = { group = "com.squareup.retrofit2", name = "retrofit",              version.ref = "retrofit" }
retrofit-gson               = { group = "com.squareup.retrofit2", name = "converter-gson",        version.ref = "retrofit" }
okhttp                      = { group = "com.squareup.okhttp3",   name = "okhttp",                version.ref = "okhttp" }
okhttp-logging              = { group = "com.squareup.okhttp3",   name = "logging-interceptor",   version.ref = "okhttp" }
gson                        = { group = "com.google.code.gson",   name = "gson",                  version.ref = "gson" }

# DataStore
datastore-preferences       = { group = "androidx.datastore", name = "datastore-preferences",     version.ref = "datastore" }

# Room
room-runtime                = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx                    = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler               = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Coroutines
coroutines-android          = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Firebase
firebase-bom                = { group = "com.google.firebase", name = "firebase-bom",              version.ref = "firebaseBom" }
firebase-messaging-ktx      = { group = "com.google.firebase", name = "firebase-messaging-ktx" }

# Build plugins (compileOnly in build-logic)
android-gradlePlugin        = { group = "com.android.tools.build", name = "gradle",                version.ref = "agp" }
kotlin-gradlePlugin         = { group = "org.jetbrains.kotlin",    name = "kotlin-gradle-plugin",  version.ref = "kotlin" }
ksp-gradlePlugin            = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
compose-gradlePlugin        = { group = "org.jetbrains.kotlin",    name = "compose-compiler-gradle-plugin",         version.ref = "kotlin" }

[plugins]
android-application         = { id = "com.android.application",           version.ref = "agp" }
android-library             = { id = "com.android.library",               version.ref = "agp" }
kotlin-android              = { id = "org.jetbrains.kotlin.android",      version.ref = "kotlin" }
kotlin-compose              = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                         = { id = "com.google.devtools.ksp",           version.ref = "ksp" }
hilt                        = { id = "com.google.dagger.hilt.android",    version.ref = "hilt" }
google-services             = { id = "com.google.gms.google-services",    version = "4.4.2" }

# Convention plugins (build-logic)
seniorsafe-android-application = { id = "seniorsafe.android.application" }
seniorsafe-android-library     = { id = "seniorsafe.android.library" }
seniorsafe-android-compose     = { id = "seniorsafe.android.compose" }
seniorsafe-android-feature     = { id = "seniorsafe.android.feature" }
seniorsafe-android-hilt        = { id = "seniorsafe.android.hilt" }
