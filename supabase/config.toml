# SeniorSafe Supabase Configuration
# https://supabase.com/docs/guides/cli/config


[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 31536000  # 365 days (device tokens)

[auth.external.phone]
enabled = false

[auth.external.email]
enabled = false

[functions.device-register]
verify_jwt = false

[functions.fcm-token]
verify_jwt = false

[functions.pairing-codes]
verify_jwt = false

[functions.pairing-claim]
verify_jwt = false

[functions.pairings-list]
verify_jwt = false

[functions.pairing-disconnect]
verify_jwt = false

[functions.activity-events]
verify_jwt = false

[functions.activity-events-list]
verify_jwt = false

[functions.service-events]
verify_jwt = false

[functions.service-events-list]
verify_jwt = false

[functions.inactivity-alerts-list]
verify_jwt = false

[functions.inactivity-check]
verify_jwt = false
